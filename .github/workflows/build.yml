name: Build Plugin
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Download BakkesMod SDK
        run: |
          curl -sL "https://github.com" -o sdk.zip
          powershell Expand-Archive -Path "sdk.zip" -DestinationPath "sdk"

      - name: Create Solution and Project Files
        run: |
          git clone https://github.com template
          xcopy /E /I /Y template\* .
          if exist "FreestylePack\FreestylePack.cpp" (
              move /Y "FreestylePack\FreestylePack.cpp" "BakkesModPluginTemplate\BakkesModPluginTemplate.cpp"
          )

      - name: Build Plugin DLL
        run: |
          msbuild BakkesModPluginTemplate.sln /p:Configuration=Release /p:Platform=x64 /p:BakkesModPath="%CD%\sdk"
          
      - name: Upload Finished DLL
        uses: actions/upload-artifact@v4
        with:
          name: FreestylePackPlugin
          path: x64/Release/BakkesModPluginTemplate.dll
