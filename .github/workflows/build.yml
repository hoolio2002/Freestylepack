name: Build Plugin
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MinGW
        uses: egor-tensin/setup-mingw@v2
        with:
          platform: x64

      - name: Download BakkesMod SDK
        run: |
          curl -sL "https://github.com" -o sdk.zip
          powershell Expand-Archive -Path "sdk.zip" -DestinationPath "sdk"

      - name: Compile DLL
        run: |
          g++ -shared -o FreestylePack.dll FreestylePack/FreestylePack.cpp -I"sdk/include" -L"sdk/lib" -lbakkesmodsdk -static-libgcc -static-libstdc++

      - name: Upload Finished DLL
        uses: actions/upload-artifact@v4
        with:
          name: FreestylePackPlugin
          path: FreestylePack.dll
